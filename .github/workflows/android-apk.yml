name: Build BluiSkill Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bluiskill-android-${{ github.run_number }}
          name: BluiSkill Android ${{ github.run_number }}
          body: |
            APK instalável da BluiSkill para Android.
            Instalação: descarrega app-debug.apk no Android, abre o ficheiro e permite a instalação a partir do navegador quando solicitado.
            Esta versão abre a aplicação web oficial em https://blui.online.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
